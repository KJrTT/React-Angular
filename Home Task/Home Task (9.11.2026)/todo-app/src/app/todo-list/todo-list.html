<app-favorites-counter></app-favorites-counter>

<ul class="todo-list">
  <li *ngFor="let todo of todos" class="todo-item">
    <span class="todo-title">{{ todo.title }}</span>
    
    <div class="actions">
      <button 
        class="star-btn" 
        (click)="toggleFavorite(todo.id)" 
        [class.filled]="favorites.isFavorite(todo.id)">
        {{ favorites.isFavorite(todo.id) ? '⭐' : '☆' }}
      </button>

      <button class="delete-btn" (click)="deleteTodo(todo.id)">
        Удалить
      </button>
    </div>
  </li>
</ul>
